name: Windows USB diagnostic subset (NOT full qualification)

# Isolated test branch only; NOT FOR MERGE. Uses this registered manual workflow
# path so main, the release workflow and the accepted candidate stay unchanged.
# No push trigger: no cross-platform rebuild, tag, release, website or robot action.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-usb-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic wrapper
        uses: actions/checkout@v5
        with:
          path: diagnostic-wrapper
          persist-credentials: false
      - name: Check out immutable accepted source
        uses: actions/checkout@v5
        with:
          ref: 2afc92a4b9f0bea5a52015f831d96619b3abd6ca
          path: candidate
          persist-credentials: false
      - name: Run unchanged eight-phase recipe (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'windows-usb-diagnostic'
          $null = New-Item -ItemType Directory -Path $root
          $recipe = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-wrapper/scripts/release/test-usbipd-observer-diagnostic.ps1'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $source = (& git -C $candidate rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne '2afc92a4b9f0bea5a52015f831d96619b3abd6ca') { throw 'Wrong source checkout' }
          $wrapper = (& git -C (Join-Path $env:GITHUB_WORKSPACE 'diagnostic-wrapper') rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $wrapper -cne $env:GITHUB_SHA) { throw 'Wrong workflow checkout' }
          $receipt = [ordered]@{ kind='diagnostic-subset-NOT-native-acceptance'; native_qualification=$false; source_revision=$source; wrapper_revision=$wrapper; github_repository=$env:GITHUB_REPOSITORY; github_run_id=$env:GITHUB_RUN_ID; github_run_attempt=$env:GITHUB_RUN_ATTEMPT; github_ref=$env:GITHUB_REF; runner_os=$env:RUNNER_OS; runner_arch=$env:RUNNER_ARCH; ps_version=$PSVersionTable.PSVersion.ToString(); ps_edition=$PSVersionTable.PSEdition; recipe_sha256=(Get-FileHash -LiteralPath $recipe -Algorithm SHA256).Hash.ToLowerInvariant(); started_utc=[DateTime]::UtcNow.ToString('o'); exit_code=$null }
          $receiptPath = Join-Path $root 'execution.json'
          [IO.File]::WriteAllText($receiptPath, ($receipt | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding($false)))
          # Windows PowerShell native stderr must not bypass failure bookkeeping.
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $recipe -ToolkitRoot $candidate -ExpectedRevision 2afc92a4b9f0bea5a52015f831d96619b3abd6ca -OutputRoot (Join-Path $root 'observer-receipts') 1> (Join-Path $root 'recipe-stdout.txt') 2> (Join-Path $root 'recipe-stderr.txt')
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $receipt.exit_code = $code
          $receipt.ended_utc = [DateTime]::UtcNow.ToString('o')
          [IO.File]::WriteAllText($receiptPath, ($receipt | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding($false)))
          Get-Content -LiteralPath (Join-Path $root 'recipe-stdout.txt')
          Get-Content -LiteralPath (Join-Path $root 'recipe-stderr.txt')
          exit $code
      - name: Close original diagnostic file inventory even on failure
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'windows-usb-diagnostic'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'Diagnostic output absent' }
          $files = [ordered]@{}
          foreach ($file in @(Get-ChildItem -LiteralPath $root -File -Recurse | Sort-Object FullName)) {
            $name = $file.FullName.Substring($root.Length + 1).Replace('\','/')
            $files[$name] = @{ bytes=$file.Length; sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $manifest = [ordered]@{ kind='closed-diagnostic-inventory-NOT-native-acceptance'; source_revision='2afc92a4b9f0bea5a52015f831d96619b3abd6ca'; wrapper_revision=$env:GITHUB_SHA; github_run_id=$env:GITHUB_RUN_ID; github_run_attempt=$env:GITHUB_RUN_ATTEMPT; files=$files }
          [IO.File]::WriteAllText((Join-Path $root 'bundle-manifest.json'), ($manifest | ConvertTo-Json -Depth 10), (New-Object Text.UTF8Encoding($false)))
      - name: Retain original native logs and diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-usb-diagnostic-${{ github.sha }}
          path: windows-usb-diagnostic/
          if-no-files-found: error
          retention-days: 7
