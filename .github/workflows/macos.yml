name: Final-source Windows native acceptance (TEST ONLY)

# Isolated wrapper branch only; NOT FOR MERGE. Registered dispatch path reused
# without modifying main, the private candidate or its real release pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-full-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out immutable test wrapper
        uses: actions/checkout@v5
        with:
          path: acceptance-wrapper
          persist-credentials: false
      - name: Check out immutable final candidate source
        uses: actions/checkout@v5
        with:
          ref: 2afc92a4b9f0bea5a52015f831d96619b3abd6ca
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install source-test dependency only
        shell: powershell
        run: |
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run original Windows bootstrap console window and readiness checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File acceptance-wrapper/scripts/release/test-windows-final-source.ps1 -ToolkitRoot (Join-Path $env:GITHUB_WORKSPACE 'candidate') -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'windows-final-receipts') -Group source
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          exit $code
      - name: Run original complete 49-phase native USB acceptance
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File acceptance-wrapper/scripts/release/test-windows-final-source.ps1 -ToolkitRoot (Join-Path $env:GITHUB_WORKSPACE 'candidate') -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'windows-final-receipts') -Group usb
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          exit $code
      - name: Run original native support acceptance
        if: always()
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File acceptance-wrapper/scripts/release/test-windows-final-source.ps1 -ToolkitRoot (Join-Path $env:GITHUB_WORKSPACE 'candidate') -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'windows-final-receipts') -Group support
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          exit $code
      - name: Retain original native receipts before strict post-upload gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-final-original-${{ github.sha }}
          path: windows-final-receipts/
          if-no-files-found: error
          retention-days: 7
      - name: Require original strict full USB receipt gate
        if: always()
        shell: powershell
        run: |
          $env:GITHUB_SHA = '2afc92a4b9f0bea5a52015f831d96619b3abd6ca'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'candidate')
          $root = Join-Path $env:GITHUB_WORKSPACE 'windows-final-receipts'
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/release/test-usbipd-native.ps1 -Mode Validate -OutputRoot (Join-Path $root 'usbipd-native-receipts') 1> (Join-Path $root 'usb-validate-stdout.txt') 2> (Join-Path $root 'usb-validate-stderr.txt')
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllText((Join-Path $root 'usb-validate-exit.json'), ('{"exit_code":' + $code + '}'))
          Get-Content -LiteralPath (Join-Path $root 'usb-validate-stdout.txt')
          Get-Content -LiteralPath (Join-Path $root 'usb-validate-stderr.txt')
          exit $code
      - name: Require original strict native support receipt gate
        if: always()
        shell: powershell
        timeout-minutes: 1
        run: |
          $env:GITHUB_SHA = '2afc92a4b9f0bea5a52015f831d96619b3abd6ca'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'candidate')
          $root = Join-Path $env:GITHUB_WORKSPACE 'windows-final-receipts'
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File scripts/release/test-support-native.ps1 -Mode Validate -OutputRoot (Join-Path $root 'support-native-receipts') 1> (Join-Path $root 'support-validate-stdout.txt') 2> (Join-Path $root 'support-validate-stderr.txt')
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllText((Join-Path $root 'support-validate-exit.json'), ('{"exit_code":' + $code + '}'))
          Get-Content -LiteralPath (Join-Path $root 'support-validate-stdout.txt')
          Get-Content -LiteralPath (Join-Path $root 'support-validate-stderr.txt')
          exit $code
      - name: Close original output inventory even on failure
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'windows-final-receipts'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'Final-source output absent' }
          $files = [ordered]@{}
          foreach ($file in @(Get-ChildItem -LiteralPath $root -File -Recurse | Sort-Object FullName)) {
            $name = $file.FullName.Substring($root.Length + 1).Replace('\','/')
            $files[$name] = @{ bytes=$file.Length; sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $manifest = [ordered]@{ kind='closed-native-Windows-inventory'; source_revision='2afc92a4b9f0bea5a52015f831d96619b3abd6ca'; wrapper_revision=$env:GITHUB_SHA; github_run_id=$env:GITHUB_RUN_ID; github_run_attempt=$env:GITHUB_RUN_ATTEMPT; files=$files }
          [IO.File]::WriteAllText((Join-Path $root 'bundle-manifest.json'), ($manifest | ConvertTo-Json -Depth 10), (New-Object Text.UTF8Encoding($false)))
      - name: Retain closed native evidence including strict-gate outcome logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-final-closed-${{ github.sha }}
          path: windows-final-receipts/
          if-no-files-found: error
          retention-days: 7
