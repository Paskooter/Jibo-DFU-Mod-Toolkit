name: Windows native fixture diagnostics

# Manual source-only evidence, NOT a release build or owner Windows 11 acceptance.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usbipd:
    name: Native usbipd source fixtures (49 phases)
    runs-on: windows-2022
    # Existing phase budgets total 1216s; leave headroom for cleanup and validation.
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check integrated usbipd sources
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/release/test-usbipd-native.ps1 -Mode Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native usbipd fixtures
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/release/test-usbipd-native.ps1 -Mode Run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usbipd-native-receipts
          path: usbipd-native-receipts/
          if-no-files-found: error
          retention-days: 7
      - name: Require complete native usbipd receipts
        if: always()
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/release/test-usbipd-native.ps1 -Mode Validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  support:
    name: Native support source fixture
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check integrated support sources
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File scripts/release/test-support-native.ps1 -Mode Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native support fixture
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File scripts/release/test-support-native.ps1 -Mode Run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-native-receipts
          path: support-native-receipts/
          if-no-files-found: error
          retention-days: 7
      - name: Require complete native support receipts
        if: always()
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File scripts/release/test-support-native.ps1 -Mode Validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
